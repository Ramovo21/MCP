name: Verify OmniMCP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/scan-secrets.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:conformance
      - name: Save sanitized conformance transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-conformance
          path: .local/conformance/*.txt
      - name: Start local Supabase and seed
        run: |
          pnpm db:start > /tmp/omnimcp-supabase-start.log 2>&1
          pnpm env:local
          pnpm db:seed
      - run: pnpm test:live
      - run: pnpm test:connectors
      - run: pnpm test:audit
      - run: pnpm build
      - name: Build production container recipes
        run: |
          docker build -f docker/Dockerfile.gateway -t omnimcp-gateway:ci .
          docker build -f docker/Dockerfile.web -t omnimcp-web:ci --build-arg NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321 --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-public-placeholder --build-arg NEXT_PUBLIC_GATEWAY_URL=http://localhost:4000 .
      - name: Separate worker and real OTLP recovery proof
        run: |
          docker compose -f docker/compose.telemetry.yml up -d
          pnpm test:staging:local
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser verification
        run: |
          pnpm start:gateway > /tmp/omnimcp-gateway.log 2>&1 &
          pnpm --filter @omnimcp/web start > /tmp/omnimcp-web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health && curl -fsS http://localhost:3000/dashboard > /dev/null; then break; fi
            sleep 2
          done
          pnpm test:e2e
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup > /tmp/omnimcp-supabase-stop.log 2>&1
      - name: Stop telemetry
        if: always()
        run: docker compose -f docker/compose.telemetry.yml down
